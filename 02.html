
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>一鍵穿越 💥</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            background: #39C5BB;
            font-family: "Microsoft JhengHei", sans-serif;
            text-align: center;
        }

        .container {
            padding: 100px 20px;
        }

        h1 {
            color: #173b3a;
            font-size: clamp(28px, 5vw, 46px);
        }

        #boomButton {
            position: relative;
            z-index: 2;
            margin-top: 100px;
            padding: 20px 38px;
            border: 3px solid #ffb15c;
            border-radius: 18px;
            background: linear-gradient(
                135deg, #ff9800, #ff3d00
            );
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 0 #a52c0a,
                        0 0 25px #ff9800;
            transition: transform 0.1s;
        }

        #boomButton:hover {
            filter: brightness(1.15);
        }

        #boomButton:active {
            transform: scale(0.92);
        }

        /* 畫面震動 */
        body.shake {
            animation: shake 0.45s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            15% { transform: translate(-10px, 5px); }
            30% { transform: translate(10px, -5px); }
            45% { transform: translate(-8px, -3px); }
            60% { transform: translate(8px, 3px); }
            75% { transform: translate(-4px, 2px); }
        }

        /* 全畫面閃光 */
        #flash {
            position: fixed;
            inset: 0;
            z-index: 5;
            background: white;
            opacity: 0;
            pointer-events: none;
        }

        #flash.active {
            animation: flash 0.4s ease-out;
        }

        @keyframes flash {
            0% { opacity: 0.95; }
            100% { opacity: 0; }
        }

        /* 火焰、煙霧、火花 */
        .particle {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 4;
            width: var(--size);
            height: var(--size);
            border-radius: var(--round);
            background: var(--color);
            box-shadow: 0 0 10px var(--color);
            pointer-events: none;
            animation: fly var(--duration) ease-out forwards;
        }

        @keyframes fly {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            60% {
                opacity: 0.9;
            }
            100% {
                transform:
                    translate(
                        calc(-50% + var(--x)),
                        calc(-50% + var(--y))
                    )
                    scale(0.1);
                opacity: 0;
            }
        }

        /* 底部提示 */
        #status {
            margin-top: 55px;
            color: #173b3a;
            font-size: 18px;
            font-weight: bold;
        }

        @media (prefers-reduced-motion: reduce) {
            body.shake {
                animation-duration: 0.01ms;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>按下去就爆炸的按鈕</h1>

        <button id="boomButton">
            購物籃
        </button>

        <div id="status">⚠️ 請小心，這顆按鈕很危險！</div>
    </main>

    <div id="flash"></div>

    <script>
        const button = document.getElementById("boomButton");
        const flash = document.getElementById("flash");
        const status = document.getElementById("status");

        let exploded = false;
        let audioContext;

        // 使用 Web Audio API 即時合成爆炸音效
        function playExplosionSound() {
            const AudioContextClass =
                window.AudioContext || window.webkitAudioContext;

            if (!AudioContextClass) {
                status.textContent = "你的瀏覽器不支援音效";
                return;
            }

            try {
                audioContext ||= new AudioContextClass();

                const ctx = audioContext;

                ctx.resume().then(() => {
                    const now = ctx.currentTime;

                    // 低頻爆炸聲
                    const oscillator = ctx.createOscillator();
                    const gain = ctx.createGain();

                    oscillator.type = "sawtooth";
                    oscillator.frequency.setValueAtTime(100, now);
                    oscillator.frequency.exponentialRampToValueAtTime(
                        25, now + 0.35
                    );

                    gain.gain.setValueAtTime(0.7, now);
                    gain.gain.exponentialRampToValueAtTime(
                        0.001, now + 0.4
                    );

                    oscillator.connect(gain);
                    gain.connect(ctx.destination);

                    oscillator.start(now);
                    oscillator.stop(now + 0.4);

                    // 產生短促的爆裂雜訊
                    const length = Math.floor(ctx.sampleRate * 0.25);
                    const buffer = ctx.createBuffer(
                        1, length, ctx.sampleRate
                    );
                    const data = buffer.getChannelData(0);

                    for (let i = 0; i < length; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }

                    const noise = ctx.createBufferSource();
                    const noiseGain = ctx.createGain();

                    noise.buffer = buffer;
                    noiseGain.gain.setValueAtTime(0.45, now);
                    noiseGain.gain.exponentialRampToValueAtTime(
                        0.001, now + 0.25
                    );

                    noise.connect(noiseGain);
                    noiseGain.connect(ctx.destination);

                    noise.start(now);
                    noise.stop(now + 0.25);
                }).catch(() => {
                    status.textContent = "音效無法播放，請再次點擊";
                });
            } catch (error) {
                console.error("音效播放失敗：", error);
            }
        }

        // 在指定位置產生火焰與火花
        function createExplosion(x, y) {
            const colors = [
                "#fff176",
                "#ffeb3b",
                "#ff9800",
                "#ff5722",
                "#f44336",
                "#ffffff"
            ];

            for (let i = 0; i < 85; i++) {
                const particle = document.createElement("div");
                particle.className = "particle";

                const angle = Math.random() * Math.PI * 2;
                const distance = 60 + Math.random() * 260;
                const size = 3 + Math.random() * 16;

                particle.style.left = x + "px";
                particle.style.top = y + "px";
                particle.style.setProperty("--x",
                    Math.cos(angle) * distance + "px");
                particle.style.setProperty("--y",
                    Math.sin(angle) * distance + "px");
                particle.style.setProperty("--size", size + "px");
                particle.style.setProperty("--color",
                    colors[Math.floor(Math.random() * colors.length)]);
                particle.style.setProperty("--round",
                    Math.random() > 0.5 ? "50%" : "2px");
                particle.style.setProperty("--duration",
                    (0.45 + Math.random() * 0.65) + "s");

                document.body.appendChild(particle);

                particle.addEventListener("animationend", () => {
                    particle.remove();
                }, { once: true });
            }
        }

        function sayhi() {
            // 避免連續點擊重複觸發
            if (exploded) return;
            exploded = true;
            button.disabled = true;

            const rect = button.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            // 爆炸特效
            createExplosion(x, y);

            // 畫面震動
            document.body.classList.remove("shake");
            void document.body.offsetWidth;
            document.body.classList.add("shake");

            // 閃光
            flash.classList.remove("active");
            void flash.offsetWidth;
            flash.classList.add("active");

            // 爆炸音效
            playExplosionSound();

            status.textContent = "💥 BOOM！爆炸了！";

            // 等待特效開始，再顯示警告
            setTimeout(() => {
                alert(
                    "BOOM！💥\n\n" +
                    "你剛才把一顆鹼金屬丟到水裡面ㄌ！\n\n" +
                    "鹼金屬與水反應會放出熱量並產生氫氣，" +
                    "可能造成燃燒或爆炸。"
                );

                // 恢復按鈕，允許再次體驗
                exploded = false;
                button.disabled = false;
                status.textContent =
                    "⚠️ 爆炸結束！可以再次點擊。";
            }, 650);
        }

        button.addEventListener("click", sayhi);
    </script>
</body>
</html>
